name: Android CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Prepare verified native dependencies
        run: ./scripts/prepare-native-deps.sh

      - name: Test, lint and build APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Stage APK variants
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/app-*-debug.apk)
          test "${#apks[@]}" -eq 5
          safe_ref="${GITHUB_REF_NAME//\//-}"
          for apk in "${apks[@]}"; do
            variant="$(basename "${apk}" | sed -E 's/^app-(.*)-debug\.apk$/\1/')"
            cp "${apk}" "dist/Lust-${safe_ref}-${variant}-debug.apk"
          done
          (cd dist && sha256sum *.apk | sort | tee SHA256SUMS.txt)

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lust-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [XRAY, SING_BOX]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Prepare verified native dependencies
        run: ./scripts/prepare-native-deps.sh

      - name: Build x86_64 APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Run API 34 VPN smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            bash scripts/seed-android-smoke.sh "${{ matrix.engine }}" app/build/outputs/apk/debug/app-x86_64-debug.apk
            EXPECT_ENGINE="${{ matrix.engine }}" bash scripts/android-vpn-smoke.sh app/build/outputs/apk/debug/app-x86_64-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download verified APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: Lust-${{ github.sha }}
          path: dist

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -Fxq "# Lust ${GITHUB_REF_NAME}" docs/release-notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Lust ${GITHUB_REF_NAME}" \
            --notes-file docs/release-notes.md \
            --prerelease \
            --verify-tag
